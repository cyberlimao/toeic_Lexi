[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toeic-forge"
version = "0.1.0"
description = "Original TOEIC reading practice with configurable model providers and audited JSON/HTML output"
requires-python = ">=3.11"
dependencies = ["google-genai>=2.31,<3", "pydantic>=2.11,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
toeic = "toeic_engine.cli:main"

[tool.setuptools.packages.find]
include = ["toeic_engine*"]

[tool.setuptools.package-data]
toeic_engine = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
